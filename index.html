<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO -->
    <title>منصة OUSO - أدوات رقمية متقدمة وخدمات ويب ذكية</title>
    <meta name="description" content="اكتشف مجموعة شاملة من الأدوات الرقمية، وخدمات الويب الذكية، وحلول الإنتاجية عبر منصة OUSO المصممة لتسهيل مهامك اليومية بكفاءة عالية.">
    <link rel="canonical" href="https://ouso.com/">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563eb">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ouso.com/">
    <meta property="og:title" content="منصة OUSO - أدوات رقمية متقدمة وخدمات ويب ذكية">
    <meta property="og:description" content="اكتشف مجموعة شاملة من الأدوات الرقمية، وخدمات الويب الذكية، وحلول الإنتاجية عبر منصة OUSO.">
    <meta property="og:image" content="https://ouso.com/assets/og-image.jpg">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://ouso.com/">
    <meta name="twitter:title" content="منصة OUSO - أدوات رقمية متقدمة وخدمات ويب ذكية">
    <meta name="twitter:description" content="اكتشف مجموعة شاملة من الأدوات الرقمية، وخدمات الويب الذكية، وحلول الإنتاجية عبر منصة OUSO.">
    <meta name="twitter:image" content="https://ouso.com/assets/og-image.jpg">

    <!-- Structured Data (Organization & WebSite) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OUSO",
      "url": "https://ouso.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ouso.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- المحتوى الأساسي يتم حقنه ديناميكياً عبر app.js و tools.js -->
    </div>

    <!-- Scripts -->
    <script src="tools.js"></script>
    <script src="app.js"></script>
</body>
</html>
